<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jstack-md</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/agent.css"><link rel="stylesheet" href="/history.css"></head>
<body>
  <header><div class="brand"><span class="mark">J</span><div><strong>jstack-md</strong><span id="filename"></span></div></div><div class="actions"><button id="history" class="secondary">History</button><button id="finish" class="primary">Finish</button></div></header>
  <main><div id="notice"></div><section id="document"></section></main>
  <dialog id="historyDialog"><div class="history-title"><div><h2>History</h2><p id="binding"></p></div><button class="icon" data-history-close aria-label="Close">×</button></div><div class="history-layout"><nav id="revisionList" aria-label="Revisions"></nav><section class="history-detail"><div class="history-detail-head"><div><strong id="historyRevision"></strong><span id="historyMeta"></span></div><button id="restoreRevision" class="secondary">Restore revision</button></div><pre id="historyDiff"></pre></section></div></dialog>
  <div id="composer" hidden><div class="selection"></div><textarea placeholder="Ask a question or request a change…" rows="3"></textarea><div><button data-cancel class="secondary">Cancel</button><button data-submit class="primary">Comment</button></div></div>
  <script type="module" src="/app.js"></script>
</body></html>
